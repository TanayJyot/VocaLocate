[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalocate-pipeline"
version = "0.1.0"
description = "Data-processing pipeline for VocaLocate: ingest, clean, transform and warehouse SFX and vocal-imitation audio."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vocalocate-pipeline = "vocalocate_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
