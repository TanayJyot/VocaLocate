name: pipeline-tests

on:
  push:
    paths: ["pipeline/**", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/pipeline-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
